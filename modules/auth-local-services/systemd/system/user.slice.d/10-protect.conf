[Slice]
# Protect the interactive agent services and tmux processes.
# memory.min is UNRECLAIMABLE - size to steady state, never to peak.
MemoryMin=1500M
MemoryLow=3G
# system.slice (the runners) is at the default 100. 2:1 only bites under
# contention; user.slice's measured demand is ~0.35-1.0 cores.
CPUWeight=200
IOWeight=200

[Service]
# VmHWM ~446 MB over 36 days; steady RSS 199-279 MB.
MemoryMin=320M
MemoryLow=512M
# Latency guarantee vs the tmux scopes, not a throughput one.
CPUWeight=500
# Deliberately NOT set: OOMScoreAdjust (EPERM from an unprivileged user
# manager), MemorySwapMax (would make hermes a global-OOM driver), IOWeight
# (inert: scheduler=[none], blk-iocost unconfigured).

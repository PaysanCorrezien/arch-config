# Keep agent/build temporary files off the RAM-backed /tmp filesystem.
# setup-dev-build.sh creates this private, disk-backed directory first.
TMPDIR=${TMPDIR:-${HOME}/.cache/devbox-tmp}
TMP=${TMP:-${TMPDIR}}
TEMP=${TEMP:-${TMPDIR}}
CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-4}
CMAKE_BUILD_PARALLEL_LEVEL=${CMAKE_BUILD_PARALLEL_LEVEL:-4}

# Host-wide Gradle tuning (managed by arch-config dev-build-cache).
# GRADLE_USER_HOME properties override each project's gradle.properties,
# lifting the 2 GB heap the Expo templates ship with while leaving room for
# concurrent agents, two Android emulators and the desktop apps.
# The JVM locale is pinned: with an Arabic session locale, Apollo codegen in
# expo-dev-launcher emitted Arabic-Indic digits into Kotlin and broke the build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=true
# Each repo pins a different Gradle version, so two daemons can coexist next
# to emulators and Electron; release them after 10 idle minutes (default 3 h).
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
org.gradle.caching=true
# This is per build, not a host-wide limit. Use one native build at a time
# when the host is under memory pressure; see docs/agent-host-memory.md.
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx1536m -Duser.language=en -Duser.country=US

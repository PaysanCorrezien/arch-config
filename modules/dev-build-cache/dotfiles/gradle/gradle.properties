# Host-wide Gradle tuning (managed by arch-config dev-build-cache).
# GRADLE_USER_HOME properties override each project's gradle.properties,
# lifting the 2 GB heap the Expo templates ship with.
# The JVM locale is pinned: with an Arabic session locale, Apollo codegen in
# expo-dev-launcher emitted Arabic-Indic digits into Kotlin and broke the build.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=true
# Each repo pins a different Gradle version, so two 8 GB daemons coexist next
# to emulators and Electron; release them after 10 idle minutes (default 3 h).
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=14
kotlin.daemon.jvmargs=-Xmx3g -Duser.language=en -Duser.country=US

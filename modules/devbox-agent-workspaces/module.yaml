# Open ChatGPT Desktop and attach to persistent Claude project sessions at KDE login.

description: Start ChatGPT Desktop and tmux-backed Claude Remote Control at login

requires:
  - tmux

dotfiles:
  - source: dotfiles/bin/devbox-agent-workspaces
    target: ~/.local/bin/devbox-agent-workspaces
  - source: dotfiles/autostart/devbox-agent-workspaces.desktop
    target: ~/.config/autostart/devbox-agent-workspaces.desktop

# Clone ~/code/brassens-monorepo and ~/code/chirac when missing.
post_install_hook: scripts/clone-workspaces.sh
hook_behavior: ask

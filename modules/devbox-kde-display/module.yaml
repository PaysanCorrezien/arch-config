# Devbox-specific KDE output manager.  KWin's generated output UUIDs change
# when an MST chain is re-enumerated, so no UUID or monitor serial is stored.
description: Runtime KDE Wayland layout for the DP/MST monitor chain

dotfiles:
  - source: scripts/devbox-display-layout
    target: ~/.local/bin/devbox-display-layout
  - source: systemd/devbox-display-layout.service
    target: ~/.config/systemd/user/devbox-display-layout.service

post_install_hook: scripts/setup.sh
hook_behavior: always

# Hermes Module
# Installs the Hermes Agent (NousResearch/hermes-agent) under ~/.hermes via the
# upstream installer, then drops in user systemd units for the gateway and the
# tailscale-only dashboard. Existing ~/.hermes state (auth.json, .env, sessions,
# state.db, memories, etc.) is preserved on reinstall.

description: Hermes Agent + gateway/dashboard user services

dotfiles:
  - source: dotfiles/bin/hermes
    target: ~/.local/bin/hermes
  - source: dotfiles/bin/hermes-dashboard-tailnet
    target: ~/.local/bin/hermes-dashboard-tailnet
  - source: dotfiles/bin/hermes-wait-network
    target: ~/.local/bin/hermes-wait-network

post_install_hook: scripts/install.sh
hook_behavior: ask

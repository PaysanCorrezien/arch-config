[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
# Reapply the dcli guard before every specialist gateway start.  This is
# deliberately a start-time check: `hermes gateway install` may recreate the
# primary unit during an upstream update, while systemd preserves this drop-in.
# Reset the upstream pre-start list so repeated installs never accumulate
# duplicate readiness checks. Keep all reliability policy in this preserved
# drop-in because Hermes refreshes its main service unit during startup.
ExecStartPre=
ExecStartPre=/usr/bin/python3 %h/.local/lib/hermes-dcli/apply-discord-thread-routing-patch.py
ExecStartPre=%h/.local/bin/hermes-wait-network
ExecStartPre=/bin/sleep @START_DELAY@
Restart=always
RestartSec=10
RestartPreventExitStatus=78
KillMode=mixed
# Hermes' own UI advertises Ctrl+C as its clean shutdown path. Using SIGINT
# avoids recording every intentional systemd restart as an application crash.
KillSignal=SIGINT
ExecStopPost=-%h/.hermes/hermes-agent/venv/bin/python -m gateway.cgroup_cleanup
TimeoutStopSec=210

# KDE Plasma 6 Desktop Environment Module
# Wayland session via KWin, with xdg-desktop-portal-kde for proper
# screencast / remote-desktop / file-picker integration.

description: KDE Plasma 6 (Wayland) desktop environment

conflicts:
  - niri
  - hyprland
  - gnome
  - xfce

dotfiles:
  # Monitors can transiently enumerate their USB hubs when powered on/off.
  # Keep the device notification but do not play the default information sound.
  - source: dotfiles/devicenotificationsrc
    target: ~/.config/devicenotificationsrc

post_install_hook: scripts/setup-kde.sh
hook_behavior: ask

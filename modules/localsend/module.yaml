# LocalSend Module
# Cross-platform file sharing application
# Requires firewall rules for receiving files

description: LocalSend file sharing with UFW firewall configuration

# LocalSend must be able to receive on the active LAN.  This hook is safe to
# rerun and follows the current uplink, so it must not wait for an interactive
# confirmation during a dcli sync.
post_install_hook: scripts/setup-localsend-firewall.sh
hook_behavior: always

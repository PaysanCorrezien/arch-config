[Service]
# RTX 3060 + libva-nvidia-driver exposes NVDEC (decode) only — no VAAPI H264
# encode entrypoint. krdpserver initialises VA-API anyway, then negotiates a
# PipeWire stream with NVIDIA DMA-BUF modifiers its software encoder cannot
# consume -> "no more input formats" -> client connects but sees a black screen.
# Forcing an invalid driver makes VA-API init fail outright, taking the clean
# software-encode path.
Environment=LIBVA_DRIVER_NAME=null

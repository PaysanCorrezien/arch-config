# fail2ban jail config for SSH
# Deployed to /etc/fail2ban/jail.local
# Managed by arch-config SSH module

[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 5
# iptables-multiport writes real rules to the kernel via iptables-nft.
# Previous value `ufw` was a silent no-op because UFW is not active here.
banaction = iptables-multiport
banaction_allports = iptables-allports

[sshd]
enabled  = true
port     = 22
filter   = sshd
backend  = systemd
maxretry = 3
bantime  = 24h

# Long-term ban for repeat offenders (re-banned 3+ times in a week → 1 week ban).
# Cuts the disk-write load from bots that cycle the 24h sshd ban.
[recidive]
enabled  = true
filter   = recidive
logpath  = /var/log/fail2ban.log
backend  = auto
maxretry = 3
findtime = 1w
bantime  = 1w
banaction = iptables-allports
